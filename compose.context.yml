services:
  context-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: context
      POSTGRES_PASSWORD: ${CONTEXT_DB_PASSWORD:-context_local}
      POSTGRES_DB: context_protocol
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - context_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context -d context_protocol"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  context_pgdata:
